# -- Markup --
# These settings are required for the theme to function.

[goldmark]
[goldmark.extensions]
	[goldmark.extensions.passthrough]
    	enable = true
        [goldmark.extensions.passthrough.delimiters]
         	block = [['\[', '\]'], ['$$', '$$']]
         	inline = [['\(', '\)'], ['$', '$']]

[goldmark.renderer]
  unsafe = true

[params]
	math = true
[highlight]
  noClasses = true

[tableOfContents]
  startLevel = 2
  endLevel = 4
