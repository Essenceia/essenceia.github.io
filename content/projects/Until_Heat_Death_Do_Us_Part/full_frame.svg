<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="96" class="svgbob"><style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
    stroke: black;
    stroke-width: 2;
    stroke-opacity: 1;
    fill-opacity: 1;
    stroke-linecap: round;
    stroke-linejoin: miter;
}
.svgbob text {
    white-space: pre;
    fill: black;
    font-family: Iosevka Fixed, monospace;
    font-size: 14px;
}
.svgbob rect.backdrop {
    stroke: none;
    fill: white;
}
.svgbob .broken {
    stroke-dasharray: 8;
}
.svgbob .filled {
    fill: black;
}
.svgbob .bg_filled {
    fill: white;
    stroke-width: 1;
}
.svgbob .nofill {
    fill: white;
}
.svgbob .end_marked_arrow {
    marker-end: url(#arrow);
}
.svgbob .start_marked_arrow {
    marker-start: url(#arrow);
}
.svgbob .end_marked_diamond {
    marker-end: url(#diamond);
}
.svgbob .start_marked_diamond {
    marker-start: url(#diamond);
}
.svgbob .end_marked_circle {
    marker-end: url(#circle);
}
.svgbob .start_marked_circle {
    marker-start: url(#circle);
}
.svgbob .end_marked_open_circle {
    marker-end: url(#open_circle);
}
.svgbob .start_marked_open_circle {
    marker-start: url(#open_circle);
}
.svgbob .end_marked_big_open_circle {
    marker-end: url(#big_open_circle);
}
.svgbob .start_marked_big_open_circle {
    marker-start: url(#big_open_circle);
}<!--separator--></style><defs><marker id="arrow" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 0,4 4,2 0,0"></polygon></marker><marker id="diamond" viewBox="-2 -2 8 8" refX="4" refY="2" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,2 2,0 4,2 2,4 0,2"></polygon></marker><marker id="circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="filled"></circle></marker><marker id="open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="2" class="bg_filled"></circle></marker><marker id="big_open_circle" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><circle cx="4" cy="4" r="3" class="bg_filled"></circle></marker></defs><rect class="backdrop" x="0" y="0" width="1016" height="96"></rect><text x="18" y="28" >Preamble</text><text x="98" y="28" >7B</text><text x="146" y="28" >SFD</text><text x="186" y="28" >1B</text><text x="234" y="28" >Dst</text><text x="266" y="28" >MAC</text><text x="306" y="28" >6B</text><text x="354" y="28" >Dst</text><text x="386" y="28" >MAC</text><text x="426" y="28" >6B</text><text x="466" y="28" >EthType</text><text x="538" y="28" >2B</text><text x="586" y="28" >Magic</text><text x="634" y="28" >Number</text><text x="698" y="28" >2B</text><text x="746" y="28" >Counteeeerrrrr</text><text x="874" y="28" >48B</text><text x="930" y="28" >FCS</text><text x="970" y="28" >4B</text><text x="218" y="76" >FF:FF:FF:FF:FF:FF</text><text x="490" y="76" >0x88B5</text><text x="578" y="76" >0xCAFE</text><text x="634" y="76" >little</text><text x="690" y="76" >endian</text><g><line x1="4" y1="8" x2="1004" y2="8" class="solid"></line><line x1="4" y1="8" x2="4" y2="40" class="solid"></line><line x1="132" y1="8" x2="132" y2="40" class="solid"></line><line 